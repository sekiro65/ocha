[supervisord]
nodaemon=true
logfile=/config/logs/supervisord.log
pidfile=/tmp/supervisord.pid

; lets the control panel start/stop/restart programs
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; Every program goes through run_with_env.py, which re-reads /config/settings.env
; on each start, so a restart from the panel applies new settings.

[program:control_panel]
command=python3 -u /app/control_panel/server.py
directory=/app/control_panel
autorestart=true
redirect_stderr=true
stdout_logfile=/config/logs/control_panel.log
stdout_logfile_maxbytes=5MB
priority=5

[program:telegram_bot]
; exits quietly until someone signs in to Telegram from the panel
command=python3 /app/control_panel/run_with_env.py --require /config/telegram/bot_session.session -- python3 -u /app/telegram_bot/telegram_userbot.py
directory=/app/telegram_bot
autorestart=unexpected
exitcodes=0
startsecs=0
redirect_stderr=true
stdout_logfile=/config/logs/telegram_bot.log
stdout_logfile_maxbytes=5MB
priority=10

[program:music_sorter]
command=python3 /app/control_panel/run_with_env.py -- python3 -u /app/music_sorter/music_import_watcher.py
directory=/app/music_sorter
autorestart=true
redirect_stderr=true
stdout_logfile=/config/logs/music_sorter.log
stdout_logfile_maxbytes=5MB
priority=20

[program:explo]
; dashboard only; listens on localhost, the panel proxies it behind its login
command=python3 /app/control_panel/run_with_env.py -- /app/explo/explo --config /config/explo/.env
directory=/config/explo
autorestart=true
redirect_stderr=true
stdout_logfile=/config/logs/explo.log
stdout_logfile_maxbytes=5MB
priority=30

[program:scheduler]
command=python3 /app/control_panel/run_with_env.py -- python3 -u /app/control_panel/scheduler.py
directory=/config/explo
autorestart=true
redirect_stderr=true
stdout_logfile=/config/logs/scheduler.out.log
stdout_logfile_maxbytes=1MB
priority=40
